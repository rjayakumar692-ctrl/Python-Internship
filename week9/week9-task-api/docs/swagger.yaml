openapi: 3.0.3
info:
  title: Task Management REST API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        status: {type: string, example: error}
        message: {type: string}
        errors: {type: object}
paths:
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 40}
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
      responses:
        '201': {description: Registered; returns user and JWT tokens}
        '400': {description: Validation error}
        '409': {description: Duplicate username/email}
  /auth/login:
    post:
      summary: Login
      responses:
        '200': {description: Authenticated; returns JWT tokens}
        '401': {description: Invalid credentials}
  /auth/refresh:
    post:
      summary: Refresh access token
      security: [{bearerAuth: []}]
      responses:
        '200': {description: New access token}
  /users/me:
    get:
      summary: Get current user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: User profile}
    patch:
      summary: Update current user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated profile}
    delete:
      summary: Delete current user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Account deleted}
  /tasks:
    get:
      summary: List, filter, search, sort and paginate own tasks
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: status, in: query, schema: {type: string, enum: [pending, in_progress, completed]}}
        - {name: priority, in: query, schema: {type: string, enum: [low, medium, high]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: sort_by, in: query, schema: {type: string, enum: [created_at, updated_at, due_date, priority, title]}}
        - {name: sort_order, in: query, schema: {type: string, enum: [asc, desc]}}
      responses:
        '200': {description: Paginated task list}
    post:
      summary: Create task
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Created task}
        '400': {description: Validation error}
  /tasks/{task_id}:
    parameters:
      - {name: task_id, in: path, required: true, schema: {type: integer}}
    get:
      summary: Get task and comments
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Task details}
        '404': {description: Not found}
    put:
      summary: Replace task fields
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated task}
    patch:
      summary: Partially update task
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated task}
    delete:
      summary: Delete task
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
  /tasks/{task_id}/comments:
    post:
      summary: Add comment
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Comment created}
